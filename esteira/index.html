<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Esteira de posts · 2L Digital Hub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="../config.js"></script>
<script src="render.js"></script>
<style>
:root{
  --bg:#f5f5f3; --surface:#ffffff; --surface2:#ecece9; --line:#deded9; --text:#151515; --muted:#6a6a64;
  --accent:#e85d0c; --accent-ink:#ffffff; --accent-soft:#fdebdf; --ok:#1f9d55; --warn:#c98a00; --bad:#d4442a;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0a0a0a; --surface:#151515; --surface2:#1e1e1e; --line:#2a2a2a; --text:#f3f3f1; --muted:#9a9a94;
  --accent:#ff6b1a; --accent-ink:#0a0a0a; --accent-soft:#2a1609; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0a0a0a; --surface:#151515; --surface2:#1e1e1e; --line:#2a2a2a; --text:#f3f3f1; --muted:#9a9a94;
  --accent:#ff6b1a; --accent-ink:#0a0a0a; --accent-soft:#2a1609; color-scheme:dark; }
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Poppins,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top a.home{color:var(--muted);text-decoration:none;font-size:13px}
.top a.home:hover{color:var(--accent)}
.brand{font-weight:700;letter-spacing:-.01em}
nav.tabs{display:flex;gap:4px;margin-left:8px;flex-wrap:wrap}
nav.tabs a{padding:7px 12px;border-radius:999px;color:var(--muted);text-decoration:none;font-size:14px}
nav.tabs a.on{background:var(--surface2);color:var(--text);font-weight:600}
.who{margin-left:auto;font-size:12px;color:var(--muted)}
main{max-width:1280px;margin:0 auto;padding:22px 18px 120px}
h1{font-size:clamp(24px,3.5vw,30px);font-weight:700;letter-spacing:-.02em;margin:0 0 4px}
h2{font-size:18px;font-weight:600;margin:0 0 10px}
.sub{color:var(--muted);font-size:14px;margin:0 0 18px}
.btn{border:0;border-radius:10px;height:42px;padding:0 16px;font-weight:600;font-size:14px;background:var(--surface2);display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn.small{height:34px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
input[type=text],input[type=number],input:not([type]),select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
label.f{display:block;font-size:12px;color:var(--muted);margin:0 0 3px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.drop{border:1.5px dashed var(--line);border-radius:14px;padding:30px 16px;text-align:center;color:var(--muted);cursor:pointer;background:var(--surface)}
.drop.over,.drop:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;display:inline-block}
.pill.novo{color:var(--muted)} .pill.pronto{color:var(--warn);border-color:var(--warn)}
.pill.revisado{color:var(--accent);border-color:var(--accent)} .pill.salvo{background:var(--ok);border-color:var(--ok);color:#fff}
.pill.erro{color:var(--bad);border-color:var(--bad)} .pill.lock{background:var(--surface2)}
.empty{border:1px dashed var(--line);border-radius:14px;padding:36px 16px;text-align:center;color:var(--muted)}
table.list{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
table.list td,table.list th{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;vertical-align:middle}
table.list th{font-size:12px;color:var(--muted);font-weight:600}
table.list tr.click{cursor:pointer} table.list tr.click:hover td{background:var(--accent-soft)}
.thumb{width:44px;height:55px;object-fit:cover;border-radius:6px;background:var(--surface2);display:block}
.lote-row{display:grid;grid-template-columns:90px 1fr 200px 130px 34px;gap:10px;align-items:start;padding:12px;border-bottom:1px solid var(--line)}
.lote-row .ph{display:flex;gap:3px;flex-wrap:wrap}
.lote-row .ph img{width:40px;height:50px;object-fit:cover;border-radius:4px}
@media (max-width:820px){.lote-row{grid-template-columns:1fr}}
.editor{display:grid;grid-template-columns:minmax(300px,520px) 1fr;gap:20px;align-items:start}
@media (max-width:900px){.editor{grid-template-columns:1fr}}
.stage{position:sticky;top:70px}
.stage canvas{width:100%;display:block;border-radius:10px;background:repeating-conic-gradient(var(--surface2) 0 25%,var(--surface) 0 50%) 0 0/24px 24px;touch-action:none;cursor:grab;box-shadow:0 6px 24px rgba(0,0,0,.15)}
.stage canvas.drag{cursor:grabbing}
.strip{display:flex;gap:6px;overflow-x:auto;padding:8px 0}
.strip .it{position:relative;flex:0 0 auto}
.strip img{width:62px;height:78px;object-fit:cover;border-radius:6px;border:2px solid transparent;display:block;cursor:pointer}
.strip .it.capa img{border-color:var(--accent)}
.strip .it.off img{opacity:.3}
.strip .it .x{position:absolute;top:2px;right:2px;font-size:11px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:4px;padding:0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.box-txt{display:grid;grid-template-columns:1fr 34px;gap:6px;align-items:end;margin-bottom:8px}
.box-txt .auto{height:38px;border:1px solid var(--line);background:none;border-radius:8px;color:var(--muted)}
.box-txt.edit input{border-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;max-width:90vw}
.lockbar{background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.prog{height:6px;background:var(--surface2);border-radius:4px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:var(--accent);width:0}
.muted{color:var(--muted)} .small{font-size:12px}
details summary{cursor:pointer;color:var(--muted);font-size:13px;margin:6px 0}
.login{max-width:360px;margin:12vh auto;text-align:center}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="home" href="../">← 2L Core</a>
  <span class="brand">Esteira de posts</span>
  <nav class="tabs" id="tabs"></nav>
  <span class="who" id="who"></span>
</div></header>
<main id="main"><p class="muted">Carregando…</p></main>
<script src="app.js"></script>
</body>
</html>
